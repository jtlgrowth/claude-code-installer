name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Smoke tests
        run: bash test/smoke.sh

  powershell:
    name: powershell (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host "install.ps1 parses"

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $bad = 0
          foreach ($f in @('./install.ps1', './test/skill-install.ps1', './w/claude.ps1', './w/codex.ps1')) {
            $results = Invoke-ScriptAnalyzer -Path $f -Severity Error,Warning `
              -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions,PSAvoidUsingInvokeExpression
            if ($results) { Write-Host "findings in $f"; $results | Format-Table -AutoSize | Out-String | Write-Host; $bad++ }
          }
          if ($bad) { exit 1 }
          Write-Host "PSScriptAnalyzer clean"

      - name: Dry run (no preset) exits 0
        shell: pwsh
        env:
          CCI_DRY_RUN: '1'
          CCI_YES: '1'
        run: |
          ./install.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "dry run exited $LASTEXITCODE"; exit 1 }

      - name: Dry run (--preset jtl, and via the env var)
        shell: pwsh
        run: |
          ./install.ps1 -DryRun -Yes -Preset jtl
          $env:CCI_PRESET = 'jtl'
          ./install.ps1 -DryRun -Yes

      - name: Dry run (--skills hire, and via the env var)
        shell: pwsh
        run: |
          ./install.ps1 -DryRun -Yes -Skills hire
          $env:CCI_SKILLS = 'hire,setup'
          ./install.ps1 -DryRun -Yes

      # The cmd.exe form documented in the README, run through a real cmd.exe.
      # A quoting mistake here is invisible from pwsh - cmd has its own rules for
      # quotes and for the pipe - and would only surface on a student's machine.
      - name: The Command Prompt one-liner parses in cmd.exe
        shell: cmd
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -Command "$env:CCI_SKILLS='hire,setup'; $env:CCI_DRY_RUN='1'; $env:CCI_YES='1'; ./install.ps1"
          if errorlevel 1 exit /b 1

      # The Windows half of the student one-liner. This is the only job that
      # runs it on Windows at all, so it downloads and extracts for real.
      # The skills sit behind a workshop key (closed after each workshop). With no
      # CCI_KEY secret, prove the live server refuses a wrong key instead, and let
      # the steps that need the skills skip.
      - name: Install the hire skill for real
        shell: pwsh
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          $env:CCI_SKILLS = 'hire,setup'
          $env:CCI_YES = '1'
          if (-not $env:CCI_KEY) {
            $env:CCI_KEY = 'wk_' + ('x' * 43)
            $out = ./install.ps1 *>&1 | Out-String
            if ($out -notmatch 'workshop key was not accepted') { Write-Error "a wrong workshop key was not refused"; exit 1 }
            "SKIP_SKILLS=1" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "no CCI_KEY secret: a wrong key is refused by the live server; skill steps skip"
            exit 0
          }
          $env:CCI_CODEX = '1'
          ./install.ps1
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          foreach ($n in 'hire','setup') {
            $c = Join-Path $env:USERPROFILE ".codex\skills\$n\SKILL.md"
            if (-not (Test-Path $c)) { Write-Error "$n not copied for Codex at $c"; exit 1 }
          }
          $xv = (codex --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Error "codex not found after -Codex install: $xv"; exit 1 }
          Write-Host "Codex $xv, hire + setup in ~/.codex/skills"
          $skill = Join-Path $env:USERPROFILE '.claude\skills\hire\SKILL.md'
          if (-not (Test-Path $skill)) { Write-Error "hire skill not installed at $skill"; exit 1 }
          node (Join-Path $env:USERPROFILE '.claude\skills\hire\test\tests.mjs')
          if ($LASTEXITCODE -ne 0) { Write-Error "hire's own tests failed"; exit 1 }
          $setup = Join-Path $env:USERPROFILE '.claude\skills\setup\SKILL.md'
          if (-not (Test-Path $setup)) { Write-Error "setup skill not installed at $setup"; exit 1 }
          node (Join-Path $env:USERPROFILE '.claude\skills\setup\test\tests.mjs')
          if ($LASTEXITCODE -ne 0) { Write-Error "setup's own tests failed"; exit 1 }
          Write-Host "hire + setup installed and their tests pass on Windows"

      # What a student does next: open a NEW window, check node, run /setup's
      # script with an alias, then type the alias. A new window builds PATH from
      # the registry, so rebuilding it here proves the persisted PATH, not this
      # session's copy. Both shells, because the room uses both.
      - name: A new window finds claude, node and the ana alias (PowerShell and cmd)
        shell: pwsh
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path','Machine') + ';' + [Environment]::GetEnvironmentVariable('Path','User')
          $cv = (claude --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { Write-Error "claude not found from a new window: $cv"; exit 1 }
          $nv = (node --version 2>&1 | Out-String).Trim()
          if ($nv -notmatch '^v(2[0-9]|[3-9][0-9])\.') { Write-Error "node from a new window: $nv"; exit 1 }
          if ($env:SKIP_SKILLS -eq '1') { Write-Host "new window: claude $cv, node $nv (alias check skipped: no workshop key)"; exit 0 }
          node (Join-Path $env:USERPROFILE '.claude\skills\setup\scripts\setup.mjs') --host claude --name Ana --alias ana
          if ($LASTEXITCODE -ne 0) { Write-Error "setup --alias failed"; exit 1 }
          $pv = (ana --version 2>&1 | Out-String).Trim()
          if ($pv -notmatch 'Claude Code') { Write-Error "ana in PowerShell printed: $pv"; exit 1 }
          $mv = (cmd /c "ana --version" 2>&1 | Out-String).Trim()
          if ($mv -notmatch 'Claude Code') { Write-Error "ana in cmd printed: $mv"; exit 1 }
          Write-Host "new window: claude $cv, node $nv, ana works in PowerShell and cmd"
          exit 0

      - name: The user PATH entry is persisted exactly once
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE '.local\bin'
          $env:CCI_YES = '1'
          ./install.ps1 *>&1 | Out-Null
          $n = @(([Environment]::GetEnvironmentVariable('Path','User') -split ';') | Where-Object { [Environment]::ExpandEnvironmentVariables($_).TrimEnd('\') -eq $bin }).Count
          if ($n -ne 1) { Write-Error "expected $bin once in the user PATH, found $n"; exit 1 }
          Write-Host "user PATH carries $bin once after a re-run"
          exit 0

      - name: Re-running must leave the skill alone
        shell: pwsh
        run: |
          if ($env:SKIP_SKILLS -eq '1') { Write-Host "skipped: no workshop key, so no skill to re-run over"; exit 0 }
          $skill = Join-Path $env:USERPROFILE '.claude\skills\hire'
          $before = (Get-ChildItem $skill -Recurse -File).Count
          $env:CCI_SKILLS = 'hire'; $env:CCI_YES = '1'
          # *>&1 merges the information stream: the installer reports through
          # Write-Host, which a plain pipeline does not capture.
          $out = ./install.ps1 *>&1 | Out-String
          $after = (Get-ChildItem $skill -Recurse -File).Count
          if ($before -ne $after) { Write-Error "file count changed $before -> $after"; exit 1 }
          if ($out -notmatch 'already present') { Write-Error "re-run did not report the skill as present"; exit 1 }
          Write-Host "re-run left the skill alone ($after files)"

      # Run in a child process so the script's own exit code is observable —
      # dot-sourcing it into this step would surface a throw, not an exit code.
      - name: Invalid skill is rejected with exit 2
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./install.ps1 -DryRun -Yes -Skills nope
          if ($LASTEXITCODE -ne 2) { Write-Error "expected exit 2, got $LASTEXITCODE"; exit 1 }
          Write-Host "invalid skill rejected with exit 2"
          exit 0

      - name: Invalid preset is rejected with exit 2
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./install.ps1 -DryRun -Yes -Preset nope
          if ($LASTEXITCODE -ne 2) { Write-Error "expected exit 2, got $LASTEXITCODE"; exit 1 }
          Write-Host "invalid preset rejected with exit 2"
          # $LASTEXITCODE is still 2 from the child; the step would inherit it.
          exit 0

      # The room pastes the line WITHOUT the key and types the key when asked. Pipe the
      # key into stdin, the way a typed answer arrives, from a clean skills folder.
      - name: The key typed at the prompt works (paste line without the key)
        shell: pwsh
        env:
          TYPED_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if (-not $env:TYPED_KEY) { Write-Host "skipped: no workshop key secret"; exit 0 }
          Remove-Item Env:CCI_KEY -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE '.claude\skills'), (Join-Path $env:USERPROFILE '.codex\skills') -ErrorAction SilentlyContinue
          $out = $env:TYPED_KEY | pwsh -NoProfile -Command "`$env:CCI_SKILLS='hire,setup'; ./install.ps1" *>&1 | Out-String
          # Read-Host does not echo its prompt when the answer is piped in, so the proof is
          # the result: CCI_KEY is unset, so these files exist only if the typed key was read.
          foreach ($p in '.claude\skills\hire\SKILL.md','.claude\skills\setup\SKILL.md','.codex\skills\hire\SKILL.md','.codex\skills\setup\SKILL.md') {
            if (-not (Test-Path (Join-Path $env:USERPROFILE $p))) { Write-Host $out; Write-Error "missing $p after typing the key"; exit 1 }
          }
          Write-Host "no CCI_KEY: the typed key installed hire + setup for Claude Code and Codex"
          exit 0

      # Codex users on Windows: -NoClaude installs only the skills, into ~/.codex/skills too.
      - name: Codex only (CCI_NO_CLAUDE) installs the skills for Codex
        shell: pwsh
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if (-not $env:CCI_KEY) { Write-Host "skipped: no workshop key secret"; exit 0 }
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE '.claude\skills'), (Join-Path $env:USERPROFILE '.codex\skills') -ErrorAction SilentlyContinue
          $env:CCI_SKILLS = 'hire,setup'; $env:CCI_NO_CLAUDE = '1'; $env:CCI_YES = '1'
          $out = ./install.ps1 *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $out; Write-Error "codex-only run exited $LASTEXITCODE"; exit 1 }
          if ($out -notmatch 'skills are installed for Codex') { Write-Host $out; Write-Error "codex-only summary missing"; exit 1 }
          if ($out -match 'running the official Anthropic installer') { Write-Error "codex-only run still ran the Claude Code installer"; exit 1 }
          foreach ($n in 'hire','setup') {
            $c = Join-Path $env:USERPROFILE ".codex\skills\$n\SKILL.md"
            if (-not (Test-Path $c)) { Write-Host $out; Write-Error "$n missing for Codex at $c"; exit 1 }
          }
          Write-Host "codex-only: hire + setup in ~/.codex/skills, Claude Code untouched"
          exit 0

      # ---- worst cases for the line the room pastes (w/claude.ps1, w/codex.ps1) ----
      # The line is fetched from GitHub in the room; here the same line fetches this
      # commit from a local server, so the test proves the code being pushed.
      - name: Serve this commit locally for the paste-line tests
        shell: pwsh
        run: |
          Start-Process python -ArgumentList '-m','http.server','8765','--bind','127.0.0.1' -WindowStyle Hidden
          Start-Sleep -Seconds 4
          $code = (Invoke-WebRequest http://127.0.0.1:8765/w/codex.ps1 -UseBasicParsing).StatusCode
          if ($code -ne 200) { Write-Error "local server answered $code"; exit 1 }
          "CCI_BASE=http://127.0.0.1:8765" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: "Worst case: the Codex line pasted into Command Prompt"
        shell: cmd
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if "%CCI_KEY%"=="" (echo skipped: no workshop key secret& exit /b 0)
          rmdir /s /q "%USERPROFILE%\.claude\skills" 2>nul
          rmdir /s /q "%USERPROFILE%\.codex\skills" 2>nul
          powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; irm http://127.0.0.1:8765/w/codex.ps1 | iex" > "%RUNNER_TEMP%\cmd-line.log" 2>&1
          type "%RUNNER_TEMP%\cmd-line.log"
          findstr /c:"skills are installed for Codex" "%RUNNER_TEMP%\cmd-line.log" >nul || (echo summary missing& exit /b 1)
          if not exist "%USERPROFILE%\.codex\skills\hire\SKILL.md" (echo hire missing for Codex& exit /b 1)
          if not exist "%USERPROFILE%\.codex\skills\setup\SKILL.md" (echo setup missing for Codex& exit /b 1)
          echo cmd: the Codex line installed hire + setup for Codex

      # The short fallback printed in the e-module (a PDF line must fit one printed row).
      - name: "Worst case: the module's short Command Prompt line"
        shell: cmd
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if "%CCI_KEY%"=="" (echo skipped: no workshop key secret& exit /b 0)
          rmdir /s /q "%USERPROFILE%\.claude\skills" 2>nul
          powershell -ExecutionPolicy Bypass -c "irm http://127.0.0.1:8765/w/claude.ps1|iex" > "%RUNNER_TEMP%\short-line.log" 2>&1
          type "%RUNNER_TEMP%\short-line.log"
          findstr /c:"Claude Code is installed and working" "%RUNNER_TEMP%\short-line.log" >nul || (echo summary missing& exit /b 1)
          if not exist "%USERPROFILE%\.claude\skills\hire\SKILL.md" (echo hire missing& exit /b 1)
          if not exist "%USERPROFILE%\.claude\skills\setup\SKILL.md" (echo setup missing& exit /b 1)
          echo cmd: the short module line installed Claude Code + hire + setup

      # Leftovers from an earlier attempt in the same window must not steer the line.
      - name: "Worst case: the Claude line pasted into Git Bash, with stale variables"
        shell: bash
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if [ -z "$CCI_KEY" ]; then echo "skipped: no workshop key secret"; exit 0; fi
          export CCI_NO_CLAUDE=1 CCI_YES=1 CCI_SKILLS=nope CCI_DRY_RUN=1
          rm -rf "$HOME/.claude/skills" "$HOME/.codex/skills"
          powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; irm http://127.0.0.1:8765/w/claude.ps1 | iex" > "$RUNNER_TEMP/bash-line.log" 2>&1 || true
          cat "$RUNNER_TEMP/bash-line.log"
          grep -q 'running the official Anthropic installer' "$RUNNER_TEMP/bash-line.log" || { echo "stale CCI_NO_CLAUDE skipped Claude Code"; exit 1; }
          grep -q 'Claude Code is installed and working' "$RUNNER_TEMP/bash-line.log" || { echo "no success summary"; exit 1; }
          for n in hire setup; do test -f "$HOME/.claude/skills/$n/SKILL.md" || { echo "$n missing"; exit 1; }; done
          echo "git bash: the Claude line ignored stale variables and installed Claude Code + hire + setup"

      # The room types the key. Here: a half-pasted key, then a wrong key, then the
      # right one, all in one run of the line inside a PowerShell window.
      - name: "Worst case: a typo, then a wrong key, then the right key (PowerShell)"
        shell: pwsh
        env:
          TYPED_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if (-not $env:TYPED_KEY) { Write-Host "skipped: no workshop key secret"; exit 0 }
          Remove-Item Env:CCI_KEY -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE '.claude\skills'), (Join-Path $env:USERPROFILE '.codex\skills') -ErrorAction SilentlyContinue
          $answers = "wk_half`n" + 'wk_' + ('x' * 43) + "`n" + $env:TYPED_KEY + "`n"
          $out = $answers | powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; irm http://127.0.0.1:8765/w/codex.ps1 | iex" *>&1 | Out-String
          if ($out -notmatch 'does not look like a workshop key') { Write-Host $out; Write-Error "the half key was not caught"; exit 1 }
          if ($out -notmatch 'workshop key was not accepted') { Write-Host $out; Write-Error "the wrong key was not refused"; exit 1 }
          foreach ($n in 'hire','setup') {
            $c = Join-Path $env:USERPROFILE ".codex\skills\$n\SKILL.md"
            if (-not (Test-Path $c)) { Write-Host $out; Write-Error "$n missing after the right key on the third try"; exit 1 }
          }
          Write-Host "typo, wrong key, right key: asked again each time, then installed"
          exit 0

      # An interrupted first run leaves folders with no SKILL.md; with Git's Unix tools
      # first on PATH, plain 'tar' is GNU tar, which reads C:\ as a remote host.
      - name: "Worst case: half-installed folders from an earlier run, GNU tar first on PATH"
        shell: pwsh
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if (-not $env:CCI_KEY) { Write-Host "skipped: no workshop key secret"; exit 0 }
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE '.claude\skills'), (Join-Path $env:USERPROFILE '.codex\skills') -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.claude\skills\hire') | Out-Null
          Set-Content (Join-Path $env:USERPROFILE '.claude\skills\hire\partial.tmp') 'x'
          New-Item -ItemType Directory -Force (Join-Path $env:USERPROFILE '.codex\skills\setup') | Out-Null
          $env:Path = 'C:\Program Files\Git\usr\bin;' + $env:Path
          Write-Host "plain tar here is: $((Get-Command tar).Source)"
          $env:CCI_SKILLS = 'hire,setup'; $env:CCI_NO_CLAUDE = '1'; $env:CCI_YES = '1'
          $out = ./install.ps1 *>&1 | Out-String
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Write-Host $out; Write-Error "exited $rc"; exit 1 }
          if ($out -notmatch 'unfinished hire folder') { Write-Host $out; Write-Error "the half folder was not noticed"; exit 1 }
          foreach ($p in '.claude\skills\hire\SKILL.md','.claude\skills\setup\SKILL.md','.codex\skills\hire\SKILL.md','.codex\skills\setup\SKILL.md') {
            if (-not (Test-Path (Join-Path $env:USERPROFILE $p))) { Write-Host $out; Write-Error "missing $p"; exit 1 }
          }
          Write-Host "half folders repaired; Windows tar used even with GNU tar first on PATH"
          exit 0

      # Real names: spaces, a dot and an n with a tilde in the Windows profile path.
      - name: "Worst case: a profile folder with spaces and non-English letters"
        shell: pwsh
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if (-not $env:CCI_KEY) { Write-Host "skipped: no workshop key secret"; exit 0 }
          $fake = Join-Path $env:RUNNER_TEMP ("Ma. Paula " + [char]0x00D1 + "i" + [char]0x00F1 + "o")
          New-Item -ItemType Directory -Force $fake | Out-Null
          $env:USERPROFILE = $fake
          $env:CCI_SKILLS = 'hire,setup'; $env:CCI_NO_CLAUDE = '1'; $env:CCI_YES = '1'
          $out = ./install.ps1 *>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Host $out; Write-Error "exited $LASTEXITCODE"; exit 1 }
          foreach ($p in '.claude\skills\hire\SKILL.md','.codex\skills\setup\SKILL.md') {
            if (-not (Test-Path -LiteralPath (Join-Path $fake $p))) { Write-Host $out; Write-Error "missing $p under $fake"; exit 1 }
          }
          Write-Host "installed under: $fake"
          exit 0

      # The line in the invite email is plain irm | iex in a PowerShell window. 'exit'
      # there closes the window on the summary; the installer must stop, not exit.
      # A do/while(false) catches a 'break', while an 'exit' would end this process.
      - name: "Worst case: irm | iex must leave the PowerShell window open"
        shell: powershell
        run: |
          # The child's 'unknown skill' line goes to stderr on purpose; under the runner's
          # Stop preference Windows PowerShell would turn that into a fatal error here.
          $ErrorActionPreference = 'Continue'
          $env:CCI_DRY_RUN = '1'; $env:CCI_YES = '1'
          $ok = powershell -NoProfile -Command 'Invoke-Expression (Get-Content -Raw ./install.ps1); Write-Host WINDOW-STILL-OPEN' *>&1 | Out-String
          if ($ok -notmatch 'WINDOW-STILL-OPEN') { Write-Host $ok; Write-Error "a finished run closed the window"; exit 1 }
          $env:CCI_SKILLS = 'nope'
          $bad = powershell -NoProfile -Command 'do { Invoke-Expression (Get-Content -Raw ./install.ps1) } while ($false); Write-Host WINDOW-STILL-OPEN' *>&1 | Out-String
          if ($bad -notmatch 'unknown skill') { Write-Host $bad; Write-Error "the bad skill was not reported"; exit 1 }
          if ($bad -notmatch 'WINDOW-STILL-OPEN') { Write-Host $bad; Write-Error "a failed run closed the window"; exit 1 }
          Write-Host "irm | iex: success and failure both leave the window open"
          exit 0

      - name: "Worst case: PowerShell locked to Constrained Language Mode by IT"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $out = powershell -NoProfile -Command '$ExecutionContext.SessionState.LanguageMode = ''ConstrainedLanguage''; Invoke-Expression (Get-Content -Raw ./install.ps1)' *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'ConstrainedLanguage mode \(set by IT\)') { Write-Error "no plain message under Constrained Language Mode"; exit 1 }
          Write-Host "constrained language mode gets one plain sentence"
          exit 0

      # Last: it edits the hosts file. An office filter that blocks the skills site
      # must be named up front, and the run must not end on "installed".
      - name: "Worst case: the office network blocks download.jtlgrowth.com"
        shell: pwsh
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          $hosts = 'C:\Windows\System32\drivers\etc\hosts'
          $orig = Get-Content -Raw $hosts
          Add-Content $hosts "`r`n0.0.0.0 download.jtlgrowth.com"
          ipconfig /flushdns | Out-Null
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE '.claude\skills'), (Join-Path $env:USERPROFILE '.codex\skills') -ErrorAction SilentlyContinue
          if (-not $env:CCI_KEY) { $env:CCI_KEY = 'wk_' + ('x' * 43) }
          $env:CCI_SKILLS = 'hire,setup'; $env:CCI_NO_CLAUDE = '1'; $env:CCI_YES = '1'
          $out = ./install.ps1 *>&1 | Out-String
          $rc = $LASTEXITCODE
          [IO.File]::WriteAllText($hosts, $orig); ipconfig /flushdns | Out-Null
          Write-Host $out
          if ($out -notmatch 'cannot reach: download\.jtlgrowth\.com') { Write-Error "the blocked site was not named up front"; exit 1 }
          if ($out -match 'skills are installed for Codex') { Write-Error "claimed success with the skills site blocked"; exit 1 }
          if ($out -notmatch 'did not install') { Write-Error "no plain not-done line"; exit 1 }
          if ($rc -eq 0) { Write-Error "exited 0 with no skills"; exit 1 }
          Write-Host "blocked site named up front; run ends not-done with exit $rc"
          exit 0

  install-linux:
    name: real install (ubuntu container)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Bootstrap curl
        run: apt-get update && apt-get install -y curl ca-certificates sudo

      - uses: actions/checkout@v5

      # The skills sit behind a workshop key (closed after each workshop). With no
      # CCI_KEY secret the installer must say so and still install Claude Code.
      - name: Install for real, with the skill the students get
        env:
          CCI_YES: '1'
          CCI_SKILLS: hire,setup
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          rc=0; bash install.sh > /tmp/install.log 2>&1 || rc=$?
          cat /tmp/install.log; exit $rc

      - name: The hire skill is installed and its own tests pass
        env:
          CCI_KEY: ${{ secrets.CCI_KEY }}
        run: |
          if [ -z "$CCI_KEY" ]; then
            grep -q "no workshop key" /tmp/install.log || { echo "no key, yet the installer did not say so"; exit 1; }
            echo "no CCI_KEY secret: skills skipped with a plain message"; exit 0
          fi
          test -f "$HOME/.claude/skills/hire/SKILL.md" || { echo "hire not installed"; exit 1; }
          node "$HOME/.claude/skills/hire/test/tests.mjs"
          test -f "$HOME/.claude/skills/setup/SKILL.md" || { echo "setup not installed"; exit 1; }
          node "$HOME/.claude/skills/setup/test/tests.mjs"

      - name: Verify claude is on PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

      - name: Re-run must be idempotent
        env:
          CCI_YES: '1'
          CCI_SKILLS: hire,setup
        run: |
          before=$(grep -c 'claude-code-installer' "$HOME/.bashrc" || true)
          files_before=$(find "$HOME/.claude/skills/hire" -type f | wc -l)
          bash install.sh
          after=$(grep -c 'claude-code-installer' "$HOME/.bashrc" || true)
          files_after=$(find "$HOME/.claude/skills/hire" -type f | wc -l)
          echo "marker count: $before -> $after   skill files: $files_before -> $files_after"
          [ "$before" = "$after" ] || { echo "shell rc grew on re-run"; exit 1; }
          [ "$files_before" = "$files_after" ] || { echo "skill was re-downloaded"; exit 1; }
